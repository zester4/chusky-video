    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["05-approval"] = tl;
      const at = (selector) => document.querySelector(selector);
      const title = at('[class~="05-approval-title"]');
      const draft = at('[class~="05-approval-draft"]');
      const recipient = at('[class~="05-approval-recipient"]');
      const message = at('[class~="05-approval-message"]');
      const pending = document.getElementById("f-05-approval-pending");
      const button = document.getElementById("f-05-approval-button");
      const status = document.getElementById("f-05-approval-status");
      const approved = document.getElementById("f-05-approval-approved");
      const cursor = document.getElementById("f-05-approval-cursor");
      const ripple = document.getElementById("f-05-approval-ripple");
      const schedule = document.getElementById("f-05-approval-schedule");
      const scheduled = document.getElementById("f-05-approval-scheduled");

      tl.fromTo(title, { y: 12, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.42, ease: "power3.out" }, 0.04);
      tl.fromTo(draft, { y: 16, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.46, ease: "power3.out" }, 0.22);
      tl.fromTo([recipient, message], { y: 9, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.34, stagger: 0.12, ease: "power3.out" }, 0.70);
      tl.fromTo([pending, button], { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.3, stagger: 0.1, ease: "power3.out" }, 1.20);

      // Cursor click sequence: considered move, paired button depression, restrained single ripple.
      tl.to(cursor, { x: 561, y: -268, duration: 0.62, ease: "power2.inOut" }, 1.63);
      tl.to(cursor, { scale: 0.86, duration: 0.08, ease: "power2.in", yoyo: true, repeat: 1 }, 2.34);
      tl.to(button, { scale: 0.95, duration: 0.08, ease: "power2.in", yoyo: true, repeat: 1 }, 2.34);
      tl.to(ripple, { scale: 2.8, autoAlpha: 0, duration: 0.72, ease: "power2.out" }, 2.40);
      tl.set([button, pending], { display: "none" }, 2.55);
      tl.set([approved, status], { display: "inline-flex", autoAlpha: 1 }, 2.55);
      tl.fromTo(approved, { scale: 0.94 }, { scale: 1, duration: 0.42, ease: "back.out(1.5)" }, 2.55);

      // The future action arrives only after approval is visibly recorded.
      tl.fromTo(schedule, { x: 14, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.46, ease: "power3.out" }, 3.56);
      tl.fromTo(scheduled, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.34, ease: "power3.out" }, 4.25);
