<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chusky launch — storyboard review</title><style>@font-face{font-family:"Instrument Sans";src:url("../assets/instrument-sans-400.woff2") format("woff2");font-weight:400}@font-face{font-family:"Instrument Sans";src:url("../assets/instrument-sans-600.woff2") format("woff2");font-weight:600}@font-face{font-family:"Instrument Serif";src:url("../assets/instrument-serif-400.woff2") format("woff2");font-weight:400}*{box-sizing:border-box}body{margin:0;padding:42px;background:#f3f3f3;color:#000;font:400 16px/1.4 "Instrument Sans",sans-serif}h1{margin:0;font:400 42px/1.05 "Instrument Serif",serif}p.intro{margin:10px 0 26px;color:#525252}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.frame{margin:0;padding:12px;border:1px solid #e5e5e5;border-radius:12px;background:#fff}.frame img{display:block;width:100%;background:#fcfcfc;border:1px solid #eee}.title{margin-top:11px;font-weight:600}.time{margin-top:2px;color:#525252;font:400 12px "JetBrains Mono",monospace}.words{margin:5px 0 2px;color:#525252;font-size:13px}@media(max-width:800px){body{padding:16px}.grid{grid-template-columns:1fr}}</style></head><body><h1>Chusky launch — storyboard</h1><p class="intro">Ten static layout frames for review. The full scenes are illustrative; the continuous mission line carries through each beat.</p><main class="grid"><figure class="frame"><img src="stills/frame-00-at-2.5s.png" alt="The request storyboard still"><figcaption><div class="title">01: The request</div><div class="time">0.0–5.0s</div><p class="words">The request</p></figcaption></figure><figure class="frame"><img src="stills/frame-01-at-7s.png" alt="One goal storyboard still"><figcaption><div class="title">02: One goal</div><div class="time">5.0–9.0s</div><p class="words">One goal</p></figcaption></figure><figure class="frame"><img src="stills/frame-02-at-13s.png" alt="Research and shortlist storyboard still"><figcaption><div class="title">03: Research and shortlist</div><div class="time">9.0–17.0s</div><p class="words">Research and shortlist</p></figcaption></figure><figure class="frame"><img src="stills/frame-03-at-20s.png" alt="Saved work storyboard still"><figcaption><div class="title">04: Saved work</div><div class="time">17.0–23.0s</div><p class="words">Saved work</p></figcaption></figure><figure class="frame"><img src="stills/frame-04-at-26s.png" alt="Approval and schedule storyboard still"><figcaption><div class="title">05: Approval and schedule</div><div class="time">23.0–29.0s</div><p class="words">Approval and schedule</p></figcaption></figure><figure class="frame"><img src="stills/frame-05-at-33s.png" alt="Calls and meetings storyboard still"><figcaption><div class="title">06: Calls and meetings</div><div class="time">29.0–37.0s</div><p class="words">Calls and meetings</p></figcaption></figure><figure class="frame"><img src="stills/frame-06-at-40.5s.png" alt="Next actions storyboard still"><figcaption><div class="title">07: Next actions</div><div class="time">37.0–44.0s</div><p class="words">Next actions</p></figcaption></figure><figure class="frame"><img src="stills/frame-07-at-47s.png" alt="Later check-in storyboard still"><figcaption><div class="title">08: Later check-in</div><div class="time">44.0–50.0s</div><p class="words">Later check-in</p></figcaption></figure><figure class="frame"><img src="stills/frame-08-at-52.5s.png" alt="Evidence and control storyboard still"><figcaption><div class="title">09: Evidence and control</div><div class="time">50.0–55.0s</div><p class="words">Evidence and control</p></figcaption></figure><figure class="frame"><img src="stills/frame-09-at-57.5s.png" alt="Give Chusky the goal storyboard still"><figcaption><div class="title">10: Give Chusky the goal</div><div class="time">55.0–60.0s</div><p class="words">Give Chusky the goal</p></figcaption></figure></main></body></html>
